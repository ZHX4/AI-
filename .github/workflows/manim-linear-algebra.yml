name: Manim Linear Algebra Checks

on:
  push:
    paths:
      - "manim/linear_algebra/**"
      - ".github/workflows/manim-linear-algebra.yml"
  pull_request:
    paths:
      - "manim/linear_algebra/**"
      - ".github/workflows/manim-linear-algebra.yml"

jobs:
  source-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manim/linear_algebra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile authoritative linear algebra sources
        run: |
          python -m py_compile parts/part_01_foundations_final.py
          python -m py_compile parts/part_02_vector_spaces.py
          python -m py_compile parts/part_03_matrices_final.py
          python -m py_compile parts/part_04_systems_final.py
          python -m py_compile parts/part_05_geometry_final.py
          python -m py_compile parts/part_06_determinants_final.py
          python -m py_compile parts/part_07_fundamental_subspaces_canonical.py
          python -m py_compile parts/part_08_eigenvalues_canonical.py
          python -m py_compile parts/part_09_symmetric_matrices_final.py
          python -m py_compile render_part1.py
          python -m py_compile render_part2.py
          python -m py_compile render_part3.py
          python -m py_compile render_part4.py
          python -m py_compile render_part5.py
          python -m py_compile render_part6.py
          python -m py_compile render_part7.py
          python -m py_compile render_part8.py
          python -m py_compile render_part9.py
          python -m py_compile verify_part2.py
          python -m py_compile verify_part3.py
          python -m py_compile verify_part4.py
          python -m py_compile verify_part5.py
          python -m py_compile verify_part6.py
          python -m py_compile verify_part7.py
          python -m py_compile verify_part8.py
          python -m py_compile verify_part9.py
      - name: Verify Part II
        run: python verify_part2.py
      - name: Verify Part III
        run: python verify_part3.py
      - name: Verify Part IV
        run: python verify_part4.py
      - name: Verify Part V
        run: python verify_part5.py
      - name: Verify Part VI
        run: python verify_part6.py
      - name: Verify Part VII
        run: python verify_part7.py
      - name: Verify Part VIII
        run: python verify_part8.py
      - name: Verify Part IX
        run: python verify_part9.py
